name: Supabase Keep-Alive

on:
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://dhzizprkqvzytzrhorce.supabase.co
          SUPABASE_KEY: sb_publishable_iweFmD1iRBYPzRwL7x4Vfg_oKhcaxJV
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 15 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/appointments?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase respondeu HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Ping falhou (esperado 200)"
            exit 1
          fi
